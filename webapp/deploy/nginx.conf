# nginx como proxy reverso para o Next.js (webapp/) a correr em localhost:3000.
#
# Instalar: copiar para /etc/nginx/sites-available/studioxxvii.conf e
#   sudo ln -s /etc/nginx/sites-available/studioxxvii.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Antes de ter certificado (primeira vez), corre o certbot --nginx (ver DEPLOY.md)
# que reescreve automaticamente o bloco 443/redirect abaixo.
#
# IMPORTANTE depois do certbot correr: confirma que o bloco 443 do domínio
# principal (studioxxvii.pt) continua a servir a app normalmente, e que o
# bloco www abaixo continua a redirecionar em vez de o certbot duplicar o
# conteúdo nos dois domínios — o certbot por vezes adiciona os dois nomes ao
# mesmo bloco 443 em vez de manter este redirect. Se isso acontecer, volta a
# separar manualmente, para o Google não ver o site duplicado em www e sem www.

# 10 pedidos/segundo por IP na API (a app tem os seus próprios limites mais finos por cima).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Canoniza em https://studioxxvii.pt — o www redireciona sempre para lá.
server {
    listen 80;
    listen [::]:80;
    server_name www.studioxxvii.pt;
    return 301 https://studioxxvii.pt$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name studioxxvii.pt;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    # A app confia em X-Real-IP para os limites de pedidos. O X-Forwarded-For é SUBSTITUÍDO (não acrescentado)
    # para o cliente nunca conseguir fazer-se passar por outro IP.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API: limite por IP no próprio nginx (antes de chegar à app) e corpos pequenos.
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 100k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nunca servir ficheiros ocultos nem de configuração.
    location ~ /\.(?!well-known) { deny all; }

    # Headers de segurança básicos (o Next.js já define os mesmos via next.config.mjs
    # para respostas da app; isto cobre também respostas estáticas servidas pelo nginx).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    server_tokens off;
}
