# nginx como proxy reverso para o Next.js (webapp/) a correr em localhost:3000.
#
# Instalar: copiar para /etc/nginx/sites-available/studioxxvii.conf e
#   sudo ln -s /etc/nginx/sites-available/studioxxvii.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Antes de ter certificado (primeira vez), corre o certbot --nginx (ver DEPLOY.md)
# que reescreve automaticamente o bloco 443/redirect abaixo.

server {
    listen 80;
    listen [::]:80;
    server_name studioxxvii.pt www.studioxxvii.pt;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Headers de segurança básicos (o Next.js já define alguns via next.config.mjs,
    # estes cobrem também respostas estáticas servidas diretamente pelo nginx).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;
}
